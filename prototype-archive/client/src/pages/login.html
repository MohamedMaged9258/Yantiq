<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yantiq — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A5744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="../css/main.css">
</head>
<body class="phone-wrap no-scrollbar overflow-y-auto"
      style="background:linear-gradient(160deg, #042F24 0%, #0A5744 40%, #0D7055 75%, #14A878 100%)">

<div class="absolute inset-0 bg-geo-pattern pointer-events-none"></div>
<!-- floating decorations -->
<div class="fixed top-24 left-6 text-5xl opacity-10 pointer-events-none" style="animation:lanternFloat 5s ease-in-out infinite">🪔</div>
<div class="fixed top-40 right-8 text-4xl opacity-10 pointer-events-none" style="animation:lanternFloat 4s ease-in-out 1s infinite">🌙</div>
<div class="fixed bottom-24 left-8 text-4xl opacity-10 pointer-events-none" style="animation:lanternFloat 7s ease-in-out 2s infinite">🕌</div>
<div class="fixed top-16 right-12 text-3xl opacity-10 pointer-events-none" style="animation:float 5s ease-in-out 0.5s infinite">🌟</div>
<!-- Radial glow behind logo -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full pointer-events-none" style="background:radial-gradient(circle, rgba(212,148,14,0.12) 0%, transparent 70%);"></div>

<div class="relative z-10 min-h-screen flex flex-col">
  <!-- Hero -->
  <div class="flex flex-col items-center pt-16 pb-8 px-6">
    <div class="w-20 h-20 rounded-4xl bg-white/15 border border-white/20 flex items-center justify-center mb-5"
         style="animation:float 3s ease-in-out infinite;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <svg width="44" height="44" viewBox="0 0 60 60" fill="none">
        <path d="M30 8C18 8 10 16 10 28c0 8 4 14 10 18 2 1.5 4 6 10 6s8-4.5 10-6c6-4 10-10 10-18C50 16 42 8 30 8z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
        <path d="M22 30Q30 22 38 30" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="30" cy="34" r="3" fill="rgba(255,255,255,0.9)"/>
        <path d="M30 18v4M24 20l2 3M36 20l-2 3" stroke="rgba(255,184,0,0.8)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="font-arabic text-white text-5xl rtl-text mb-1" style="animation:fadeIn 0.6s 0.2s ease both;opacity:0;animation-fill-mode:both">ينطق</h1>
    <p class="font-display text-white/80 text-lg tracking-widest uppercase" style="animation:fadeIn 0.6s 0.4s ease both;opacity:0;animation-fill-mode:both">Yantiq</p>
    <p class="text-white/60 font-semibold text-sm mt-2 text-center" style="animation:fadeIn 0.6s 0.5s ease both;opacity:0;animation-fill-mode:both">Welcome back! Continue Layla's journey 🌟</p>
  </div>

  <!-- Form card -->
  <div class="flex-1 bg-cream rounded-t-[40px] px-6 pt-8 pb-10"
       style="animation:slideUp 0.5s 0.3s ease both;opacity:0;animation-fill-mode:both">
    <h2 class="font-display text-gray-900 text-2xl mb-6">Sign In</h2>

    <form id="login-form" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-extrabold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
        <input type="email" id="email" class="input-field" placeholder="sara@example.com" autocomplete="email" required>
      </div>
      <div>
        <label class="block text-xs font-extrabold text-gray-500 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input type="password" id="password" class="input-field pr-12" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" onclick="togglePw()" tabindex="-1"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm font-bold">👁</button>
        </div>
      </div>
      <div class="flex justify-end">
        <a href="./reset-password.html" class="text-primary font-extrabold text-sm hover:underline">Forgot password?</a>
      </div>

      <!-- Error message -->
      <div id="login-error" class="hidden bg-coral-50 border-2 border-coral/20 rounded-2xl px-4 py-3 text-coral font-bold text-sm text-center"></div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-full font-display text-xl mt-2">
        <span id="btn-text">Sign In →</span>
        <span id="btn-loading" class="hidden">Signing in...</span>
      </button>
    </form>

    <div class="flex items-center gap-3 my-5 text-gray-400 text-sm font-bold">
      <div class="flex-1 h-px bg-cream-darker"></div>or<div class="flex-1 h-px bg-cream-darker"></div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-6">
      <button class="flex items-center justify-center gap-2 py-3 rounded-2xl border-2 border-cream-darker bg-white font-bold text-gray-700 text-sm hover:border-primary/30 transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M20.283 10.356h-8.327v3.451h4.792c-.446 2.193-2.313 3.453-4.792 3.453a5.27 5.27 0 0 1-5.279-5.28 5.27 5.27 0 0 1 5.279-5.279c1.259 0 2.397.447 3.29 1.178l2.6-2.599c-1.584-1.381-3.615-2.233-5.89-2.233a8.908 8.908 0 0 0-8.934 8.934 8.908 8.908 0 0 0 8.934 8.934c4.467 0 8.529-3.249 8.529-8.934 0-.528-.081-1.097-.202-1.625z" fill="#4285F4"/></svg>
        Google
      </button>
      <button class="flex items-center justify-center gap-2 py-3 rounded-2xl border-2 border-cream-darker bg-white font-bold text-gray-700 text-sm hover:border-primary/30 transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A5744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 18z"/>
        </svg>
        Phone
      </button>
    </div>

    <p class="text-center text-gray-400 font-semibold text-xs mb-4">Sign in with your preferred method</p>

    <p class="text-center text-gray-500 font-semibold text-sm">
      Don't have an account?
      <a href="./register.html" class="text-primary font-extrabold hover:underline ml-1">Create one →</a>
    </p>
    <p class="text-center mt-3">
      <a href="./app.html" class="text-gray-400 font-bold text-xs hover:underline">Demo: Skip login →</a>
    </p>
  </div>
</div>

<script type="module">
import { authAPI, passwordAPI } from '../js/utils/api.js';
import { setState } from '../js/utils/storage.js';
import { toast } from '../js/utils/animations.js';

// Show session-expired banner if redirected by idle watcher
if (sessionStorage.getItem('session_expired')) {
  sessionStorage.removeItem('session_expired');
  const errEl = document.getElementById('login-error');
  if (errEl) {
    errEl.textContent = '⏱ Your session expired after 30 minutes of inactivity. Please sign in again.';
    errEl.classList.remove('hidden');
  }
}

window.togglePw = () => {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
};

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const btnLoading = document.getElementById('btn-loading');
  const errEl = document.getElementById('login-error');

  btnText.classList.add('hidden');
  btnLoading.classList.remove('hidden');
  btn.disabled = true;
  errEl.classList.add('hidden');

  try {
    const res = await authAPI.login({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    setState('accessToken', res.data.data.accessToken);
    setState('currentUser', res.data.data.user);
    toast('Welcome back! 🌟', 'success', 2000);
    setTimeout(() => window.location.href = './app.html', 500);
  } catch (err) {
    const msg = err.response?.data?.message || 'Login failed. Please check your credentials.';
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
    errEl.style.animation = 'shake 0.4s ease';
  } finally {
    btnText.classList.remove('hidden');
    btnLoading.classList.add('hidden');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
