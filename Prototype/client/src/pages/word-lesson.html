<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yantiq — Word Lesson</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A5744">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-white phone-wrap no-scrollbar overflow-y-auto">
<header style="background:linear-gradient(160deg, #042F24 0%, #0A5744 50%, #0D7055 100%); box-shadow: 0 8px 32px rgba(4,47,36,0.4);padding-top:env(safe-area-inset-top)" class="pb-5 px-4 relative overflow-hidden">
  <div class="absolute inset-0 bg-geo-pattern-sm pointer-events-none opacity-100"></div>
  <div class="particle text-white/12 text-2xl" style="--duration:6s;--delay:0s; top:20%;left:8%;">📖</div>
  <div class="particle text-white/10 text-xl" style="--duration:7s;--delay:1.5s; top:55%;left:82%;">🌙</div>
  <div class="particle text-white/10 text-2xl" style="--duration:8s;--delay:2.5s; top:40%;left:50%;">✨</div>
  <div class="fixed top-24 right-4 text-3xl opacity-15 pointer-events-none" style="animation:lanternFloat 5s ease-in-out infinite">🪔</div>
  <div class="relative z-10 pt-10">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="window.location.href='./app.html'"
              class="w-10 h-10 rounded-2xl bg-white/15 border border-white/20 flex items-center justify-center text-white text-lg">←</button>
      <div class="flex-1">
        <p class="text-white/60 text-xs font-bold uppercase tracking-wider">Level 2 Preview</p>
        <h1 class="font-display text-white text-xl mt-0.5">Words — <span class="font-arabic">الكلمات</span></h1>
      </div>
      <div class="glass rounded-2xl px-3 py-1.5 flex-shrink-0">
        <span class="font-display text-white text-xs">PREVIEW 👁</span>
      </div>
    </div>
    <!-- word nav dots -->
    <div class="flex items-center justify-between">
      <button onclick="prevWord()" class="w-8 h-8 rounded-full bg-white/15 border border-white/20 flex items-center justify-center text-white text-lg hover:bg-white/25">‹</button>
      <div class="flex gap-2" id="wdots">
        <div class="w-5 h-2 rounded-full bg-white transition-all" id="wd0"></div>
        <div class="w-2 h-2 rounded-full bg-white/30 transition-all" id="wd1"></div>
        <div class="w-2 h-2 rounded-full bg-white/30 transition-all" id="wd2"></div>
        <div class="w-2 h-2 rounded-full bg-white/30 transition-all" id="wd3"></div>
      </div>
      <button onclick="nextWord()" class="w-8 h-8 rounded-full bg-white/15 border border-white/20 flex items-center justify-center text-white text-lg hover:bg-white/25">›</button>
    </div>
  </div>
</header>

<main class="px-4 pt-5 pb-24">
  <!-- Word display -->
  <div id="word-display" class="rounded-4xl p-6 text-center mb-5 relative overflow-hidden"
       style="background:linear-gradient(135deg,#E6F5EF,#C3E8D9);border:2px solid rgba(10,87,68,0.1)">
    <div class="absolute top-3 right-4 text-5xl opacity-20 pointer-events-none" style="animation:float 4s ease-in-out infinite" id="word-deco">🏠</div>
    <span class="text-6xl mb-3 block" id="word-emoji" style="animation:float 3s ease-in-out infinite">🏠</span>
    <p class="font-arabic text-primary rtl-text mb-2" style="font-size:60px;line-height:1.2" id="word-ar">بَيْتٌ</p>
    <p class="font-display text-primary-700 text-xl tracking-widest uppercase mb-1" id="word-en">House</p>
    <p class="font-bold text-primary/60 text-sm italic" id="word-trans">Baytun</p>
  </div>

  <!-- Letter breakdown -->
  <div class="mb-5">
    <p class="text-xs font-extrabold text-gray-400 uppercase tracking-widest mb-3">Letter Breakdown</p>
    <div class="flex items-center gap-2 flex-row-reverse justify-start" id="breakdown">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- Action buttons -->
  <div class="grid grid-cols-2 gap-3 mb-5">
    <button onclick="simulateListen(this)"
            class="flex flex-col items-center gap-2 p-5 rounded-3xl border-2 border-gold/20 bg-gold-50 cursor-pointer hover:border-gold hover:bg-gold-100 transition-all group active:scale-95">
      <div class="w-12 h-12 rounded-2xl bg-gold/15 flex items-center justify-center text-2xl group-hover:animate-wiggle">🔊</div>
      <p class="font-display text-gray-900 text-base">Listen</p>
      <p class="text-gray-400 text-xs">Hear pronunciation</p>
    </button>
    <button onclick="simulateSpeak(this)"
            class="flex flex-col items-center gap-2 p-5 rounded-3xl border-2 border-primary/15 bg-primary-50 cursor-pointer hover:border-primary hover:bg-primary-100 transition-all group active:scale-95">
      <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-2xl group-hover:animate-wiggle">🎙</div>
      <p class="font-display text-gray-900 text-base">Speak</p>
      <p class="text-gray-400 text-xs">AI will score you</p>
    </button>
  </div>

  <!-- Example sentence -->
  <div class="rounded-3xl p-4 mb-5" style="background:linear-gradient(135deg,#FEF7E6,#FDEFC8);border:1.5px solid rgba(212,148,14,0.2)">
    <p class="text-xs font-extrabold text-gold uppercase tracking-wider mb-2">Example Sentence ✍️</p>
    <p class="font-arabic text-gray-900 rtl-text text-xl text-right leading-relaxed mb-1" id="ex-ar">هَذَا بَيْتٌ كَبِيرٌ</p>
    <p class="font-semibold text-gray-600 text-sm" id="ex-en">This is a big house</p>
  </div>

  <!-- Lock notice -->
  <div class="rounded-3xl p-4 text-center border-2 border-dashed border-primary/20 bg-primary-50/50">
    <p class="font-display text-primary text-base mb-1">🏛️ Complete Level 1 to unlock</p>
    <p class="text-gray-500 text-sm font-semibold mb-3">You're 2 stages away from full access!</p>
    <button onclick="window.location.href='./lesson.html'"
            class="btn btn-primary btn-sm font-display">Continue Level 1 →</button>
  </div>
</main>

<script type="module">
import { spawnEmojis, correctPop, toast, showXPGain } from '../js/utils/animations.js';

const words = [
  { ar:'بَيْتٌ', en:'House', emoji:'🏠', trans:'Baytun', breakdown:[{ar:'بَ',en:'Ba'},{ar:'يْ',en:'Ay'},{ar:'تٌ',en:'Tun'}], exAr:'هَذَا بَيْتٌ كَبِيرٌ', exEn:'This is a big house' },
  { ar:'كِتَابٌ', en:'Book', emoji:'📚', trans:'Kitaabun', breakdown:[{ar:'كِ',en:'Ki'},{ar:'تَا',en:'Taa'},{ar:'بٌ',en:'Bun'}], exAr:'هَذَا كِتَابٌ جَمِيلٌ', exEn:'This is a beautiful book' },
  { ar:'شَمْسٌ', en:'Sun', emoji:'☀️', trans:'Shamsun', breakdown:[{ar:'شَ',en:'Sha'},{ar:'مْ',en:'M'},{ar:'سٌ',en:'Sun'}], exAr:'الشَّمْسُ سَاطِعَةٌ', exEn:'The sun is shining' },
  { ar:'مَاءٌ', en:'Water', emoji:'🌊', trans:"Maa'un", breakdown:[{ar:'مَا',en:'Maa'},{ar:'ءٌ',en:'Un'}], exAr:'الْمَاءُ بَارِدٌ', exEn:'The water is cold' },
];
let wIdx = 0;

function renderWord(i) {
  const w = words[i];
  document.getElementById('word-ar').textContent = w.ar;
  document.getElementById('word-en').textContent = w.en;
  document.getElementById('word-emoji').textContent = w.emoji;
  document.getElementById('word-deco').textContent = w.emoji;
  document.getElementById('word-trans').textContent = w.trans;
  document.getElementById('ex-ar').textContent = w.exAr;
  document.getElementById('ex-en').textContent = w.exEn;
  // Breakdown
  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';
  w.breakdown.forEach((letter, li) => {
    if (li > 0) {
      const plus = document.createElement('span');
      plus.textContent = '+';
      plus.className = 'text-gray-300 text-xl font-bold';
      bd.appendChild(plus);
    }
    const chip = document.createElement('div');
    chip.className = 'flex flex-col items-center gap-1 w-16 h-18 rounded-2xl border-2 border-primary/10 bg-primary-50 p-2 cursor-pointer hover:border-primary hover:bg-primary-100 transition-all active:scale-95';
    chip.innerHTML = `<span class="font-arabic text-primary rtl-text text-2xl leading-tight">${letter.ar}</span><span style="font-size:9px" class="font-extrabold text-gray-400 uppercase tracking-wide">${letter.en}</span>`;
    chip.onclick = () => { spawnEmojis(['✨'], chip, 2); toast(`"${letter.en}" sound! 🎵`, 'info', 1200); };
    bd.appendChild(chip);
  });
  // Dots
  for (let j=0; j<4; j++) {
    const d = document.getElementById('wd'+j);
    if (!d) continue;
    if (j===i) { d.style.width='20px'; d.style.background='white'; }
    else { d.style.width='8px'; d.style.background='rgba(255,255,255,0.3)'; }
  }
  // animate word in
  const display = document.getElementById('word-display');
  display.style.animation = 'scaleIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both';
  setTimeout(() => { display.style.animation = ''; }, 400);
}

window.nextWord = () => { wIdx = Math.min(wIdx+1, words.length-1); renderWord(wIdx); };
window.prevWord = () => { wIdx = Math.max(wIdx-1, 0); renderWord(wIdx); };

// ─── Listen button ─────────────────────────────────────
window.simulateListen = (btn) => {
  const word    = words[wIdx];
  const origHtml = btn.innerHTML;
  btn.innerHTML  = `<div class="w-12 h-12 rounded-2xl bg-gold/20 flex items-center justify-center text-2xl">▶️</div><p class="font-display text-gray-900 text-base">Playing...</p><p class="text-gray-400 text-xs">🎵 Listen carefully</p>`;
  btn.disabled   = true;
  const done = () => { btn.innerHTML = origHtml; btn.disabled = false; toast(`Heard "${word.en}"? Now speak! 🎙`,'info',2000); };
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word.ar);
    u.lang = 'ar-SA'; u.rate = 0.7;
    u.onend = done; u.onerror = done;
    const go = () => { const v = window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('ar')); if(v) u.voice=v; window.speechSynthesis.speak(u); };
    if (window.speechSynthesis.getVoices().length) { go(); } else { window.speechSynthesis.onvoiceschanged = go; setTimeout(go, 300); }
  } else { setTimeout(done, 2000); }
};

// ─── Speak button — real mic + AI evaluation ──────────
window.simulateSpeak = async (btn) => {
  const { startRecording, stopRecording, evaluatePronunciation, getIsRecording, requestMicPermission } =
    await import('../js/modules/pronunciation.js');
  const { getState } = await import('../js/utils/storage.js');
  const { progressAPI } = await import('../js/utils/api.js');

  const word   = words[wIdx];
  const child  = getState('activeChild');

  const hasMic = await requestMicPermission();
  if (!hasMic) {
    toast('Microphone access needed for pronunciation scoring.', 'error', 4000);
    return;
  }

  const orig = btn.innerHTML;
  btn.innerHTML = `<div class="w-12 h-12 rounded-2xl bg-coral/15 flex items-center justify-center text-2xl">🔴</div><p class="font-display text-gray-900 text-base">Listening...</p><p class="text-gray-400 text-xs">Speak now</p>`;
  btn.disabled = true;

  try {
    await startRecording();
    await new Promise(r => setTimeout(r, 3500));
    const audioBlob = await stopRecording();

    btn.innerHTML = `<div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-2xl">🤔</div><p class="font-display text-gray-900 text-base">Scoring...</p><p class="text-gray-400 text-xs">AI analysing</p>`;

    const result = await evaluatePronunciation({
      childId:  child?.id || 'demo',
      lessonId: word.lessonId || '',
      targetAr: word.ar, targetEn: word.en, audioBlob,
    });

    const sc = result.score;
    btn.innerHTML = `<div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-2xl">${sc>=70?'✅':'💪'}</div><p class="font-display text-primary text-base">${sc}%!</p><p class="text-gray-400 text-xs">${sc>=90?'Excellent!':sc>=70?'Good try!':'Keep practising'}</p>`;
    spawnEmojis(sc >= 70 ? ['🌟','✨'] : ['💪'], btn, 4);
    showXPGain(sc >= 70 ? 15 : 5, btn);
    toast(`${sc}% accuracy! ${sc>=90?'Amazing! 🌟':sc>=70?'Good job! 👍':'Try again!'}`, sc>=70?'success':'info');

    if (child?.id && word.lessonId) {
      progressAPI.logSession(child.id, {
        lessonId: word.lessonId, score: sc, accuracyPct: sc,
        starsEarned: sc>=90?3:sc>=70?2:1, attempts:1, completed: sc>=70,
      }).catch(() => {});
    }

    setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 3500);
  } catch (err) {
    console.error('Word speak error:', err);
    btn.innerHTML = orig; btn.disabled = false;
    toast('Could not record. Check microphone and try again.', 'error');
  }
};

// Init
renderWord(0);
</script>
</body>
</html>
